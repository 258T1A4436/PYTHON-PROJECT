<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Library Management System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">

    <div class="auth-wrapper">
        <div class="card auth-card">
            <div class="auth-header">
                <div class="brand-icon">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to access the Library Management System</p>
            </div>

            <!-- Alert Notification Banner -->
            {{alert_message}}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter username (e.g. admin)" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password (e.g. admin123)" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account yet? <a href="/register">Register here</a></p>
                <div class="demo-credentials">
                    <strong>Demo Admin:</strong> Username: <code>admin</code> &bull; Password: <code>admin123</code>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
